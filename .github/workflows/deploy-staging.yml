name: Deploy to Staging (staging.easternlm.com)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DOCKER_IMAGE: easternlm-web
  CONTAINER_NAME: easternlm-staging
  HOST_PORT: 3101
  CONTAINER_PORT: 3000
  DEPLOY_PATH: /opt/easternlm-web

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 5.161.88.134 >> ~/.ssh/known_hosts 2>/dev/null
          echo "Key fingerprint:"
          ssh-keygen -l -f ~/.ssh/deploy_key

      - name: Deploy to VPS
        env:
          VPS_HOST: "5.161.88.134"
          VPS_USER: "root"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 \
            ${VPS_USER}@${VPS_HOST} bash << ENDSSH
            set -e
            cd ${{ env.DEPLOY_PATH }}

            echo "=== Pulling latest code ==="
            git fetch "https://x-access-token:${GH_TOKEN}@github.com/afintech510/easternLM.git" main
            git reset --hard FETCH_HEAD

            echo "=== Loading build env from .env.local ==="
            set -a
            source /opt/easternlm-web/.env.local
            set +a

            # Staging MUST use Stripe TEST keys (live keys are the .env.local default)
            if [ -n "\${STRIPE_SECRET_KEY_TEST:-}" ]; then
              export STRIPE_SECRET_KEY="\${STRIPE_SECRET_KEY_TEST}"
              export NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY="\${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY_TEST}"
            fi

            echo "=== Building Docker image (staging — test Stripe) ==="
            docker build \
              --build-arg NEXT_PUBLIC_SUPABASE_URL="\${NEXT_PUBLIC_SUPABASE_URL}" \
              --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="\${NEXT_PUBLIC_SUPABASE_ANON_KEY}" \
              --build-arg SUPABASE_SERVICE_ROLE_KEY="\${SUPABASE_SERVICE_ROLE_KEY}" \
              --build-arg STRIPE_SECRET_KEY="\${STRIPE_SECRET_KEY}" \
              --build-arg NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY="\${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}" \
              -t ${{ env.DOCKER_IMAGE }}:latest \
              .

            echo "=== Swapping container ==="
            docker stop ${{ env.CONTAINER_NAME }} 2>/dev/null || true
            docker rm ${{ env.CONTAINER_NAME }} 2>/dev/null || true

            docker run -d \
              --name ${{ env.CONTAINER_NAME }} \
              --restart unless-stopped \
              --network hosthampton_hampton_net \
              -p ${{ env.HOST_PORT }}:${{ env.CONTAINER_PORT }} \
              --env-file /opt/easternlm-web/.env.local \
              -e NODE_ENV=production \
              -e NEXT_PUBLIC_SITE_URL=https://staging.easternlm.com \
              -e STRIPE_SECRET_KEY="\${STRIPE_SECRET_KEY}" \
              ${{ env.DOCKER_IMAGE }}:latest

            echo "=== Health check ==="
            sleep 5
            if curl -sf http://localhost:${{ env.HOST_PORT }} > /dev/null 2>&1; then
              echo "Deployment successful!"
            else
              docker logs --tail 20 ${{ env.CONTAINER_NAME }}
              exit 1
            fi

            docker image prune -f
          ENDSSH

      - name: Run E2E Tests
        if: success()
        run: |
          npx playwright install chromium --with-deps
          PLAYWRIGHT_BASE_URL=https://staging.easternlm.com npx playwright test --project=desktop
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        continue-on-error: true
