name: Deploy to Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DOCKER_IMAGE: easternlm-web
  CONTAINER_NAME: easternlm-staging
  HOST_PORT: 3101
  CONTAINER_PORT: 3000
  DEPLOY_PATH: /opt/easternlm-web

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "."
          target: ${{ env.DEPLOY_PATH }}
          overwrite: true

      - name: Build and deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 10m
          script: |
            cd ${{ env.DEPLOY_PATH }}

            echo "=== Building Docker image ==="
            docker build \
              --build-arg NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }} \
              --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }} \
              --build-arg SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }} \
              --build-arg STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }} \
              --build-arg NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }} \
              -t ${{ env.DOCKER_IMAGE }}:latest \
              -t ${{ env.DOCKER_IMAGE }}:${{ github.sha }} \
              .

            echo "=== Stopping old container ==="
            docker stop ${{ env.CONTAINER_NAME }} 2>/dev/null || true
            docker rm ${{ env.CONTAINER_NAME }} 2>/dev/null || true

            echo "=== Starting new container ==="
            docker run -d \
              --name ${{ env.CONTAINER_NAME }} \
              --restart unless-stopped \
              --network hosthampton_hampton_net \
              -p ${{ env.HOST_PORT }}:${{ env.CONTAINER_PORT }} \
              -e NODE_ENV=production \
              -e NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }} \
              -e NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }} \
              -e SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }} \
              -e STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }} \
              -e STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }} \
              -e NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }} \
              -e GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }} \
              -e RESEND_API_KEY=${{ secrets.RESEND_API_KEY }} \
              -e RESEND_FROM_EMAIL=${{ secrets.RESEND_FROM_EMAIL }} \
              -e TWILIO_ACCOUNT_SID=${{ secrets.TWILIO_ACCOUNT_SID }} \
              -e TWILIO_AUTH_TOKEN=${{ secrets.TWILIO_AUTH_TOKEN }} \
              -e TWILIO_PHONE_NUMBER=${{ secrets.TWILIO_PHONE_NUMBER }} \
              -e ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }} \
              -e RINGCENTRAL_JWT=${{ secrets.RINGCENTRAL_JWT }} \
              -e NEXT_PUBLIC_SITE_URL=https://staging.easternlm.com \
              ${{ env.DOCKER_IMAGE }}:latest

            echo "=== Waiting for health check ==="
            sleep 5
            if curl -sf http://localhost:${{ env.HOST_PORT }} > /dev/null 2>&1; then
              echo "Deployment successful! Site is responding."
            else
              echo "Warning: Site not responding yet. Check container logs:"
              docker logs --tail 20 ${{ env.CONTAINER_NAME }}
              exit 1
            fi

            echo "=== Cleaning up old images ==="
            docker image prune -f
