name: Deploy to Staging (staging.easternlm.com)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DOCKER_IMAGE: easternlm-web
  CONTAINER_NAME: easternlm-staging
  HOST_PORT: 3101
  CONTAINER_PORT: 3000
  DEPLOY_PATH: /opt/easternlm-web
  DOCKER_NETWORK: hosthampton_hampton_net

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 10m
          script: |
            cd ${{ env.DEPLOY_PATH }}

            echo "=== Pulling latest code ==="
            git pull

            echo "=== Loading env vars ==="
            eval $(grep -v "^#" .env.local | sed 's/^/export /')

            echo "=== Building Docker image ==="
            docker build \
              --build-arg NEXT_PUBLIC_SUPABASE_URL="$NEXT_PUBLIC_SUPABASE_URL" \
              --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="$NEXT_PUBLIC_SUPABASE_ANON_KEY" \
              --build-arg SUPABASE_SERVICE_ROLE_KEY="$SUPABASE_SERVICE_ROLE_KEY" \
              --build-arg STRIPE_SECRET_KEY="$STRIPE_SECRET_KEY" \
              --build-arg NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY="$NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY" \
              -t ${{ env.DOCKER_IMAGE }}:latest \
              -t ${{ env.DOCKER_IMAGE }}:${{ github.sha }} \
              .

            echo "=== Stopping old container ==="
            docker stop ${{ env.CONTAINER_NAME }} 2>/dev/null || true
            docker rm ${{ env.CONTAINER_NAME }} 2>/dev/null || true

            echo "=== Starting new container ==="
            docker run -d \
              --name ${{ env.CONTAINER_NAME }} \
              --network ${{ env.DOCKER_NETWORK }} \
              --restart unless-stopped \
              -p ${{ env.HOST_PORT }}:${{ env.CONTAINER_PORT }} \
              --env-file ${{ env.DEPLOY_PATH }}/.env.local \
              ${{ env.DOCKER_IMAGE }}:latest

            echo "=== Waiting for health check ==="
            sleep 5
            if curl -sf http://localhost:${{ env.HOST_PORT }} > /dev/null 2>&1; then
              echo "Deployment successful! Site is responding."
            else
              echo "Warning: Site not responding yet. Check container logs:"
              docker logs --tail 20 ${{ env.CONTAINER_NAME }}
              exit 1
            fi

            echo "=== Cleaning up old images ==="
            docker image prune -f
