# ─── easternbuilding.supply → easternlm.com 301 redirects ────────
# Apply this config AFTER:
#   1. easternlm.com DNS points to the VPS
#   2. easternbuilding.supply DNS points to the VPS
#   3. SSL certs provisioned for easternbuilding.supply
#
# To provision certs:
#   certbot certonly --nginx -d easternbuilding.supply -d www.easternbuilding.supply

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name easternbuilding.supply www.easternbuilding.supply;
    return 301 https://easternlm.com$request_uri;
}

# HTTPS → easternlm.com 301 redirects
server {
    listen 443 ssl;
    server_name easternbuilding.supply www.easternbuilding.supply;

    # SSL cert (uncomment after certbot provisioning)
    # ssl_certificate /etc/letsencrypt/live/easternbuilding.supply/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/easternbuilding.supply/privkey.pem;

    # ── WooCommerce product pages ──────────────────────────────
    # /product/dark-natural-mulch → /shop/dark-natural-mulch
    location ~ ^/product/(.+?)/?$ {
        return 301 https://easternlm.com/shop/$1;
    }

    # ── WooCommerce category pages ─────────────────────────────
    # /product-category/mulch → /shop?category=mulch
    location ~ ^/product-category/(.+?)/?$ {
        return 301 https://easternlm.com/shop?category=$1;
    }

    # ── Known pages ────────────────────────────────────────────
    location = /shop { return 301 https://easternlm.com/shop; }
    location = /shop/ { return 301 https://easternlm.com/shop; }
    location = /cart { return 301 https://easternlm.com/cart; }
    location = /cart/ { return 301 https://easternlm.com/cart; }
    location = /checkout { return 301 https://easternlm.com/checkout; }
    location = /checkout/ { return 301 https://easternlm.com/checkout; }
    location = /contact { return 301 https://easternlm.com/contact; }
    location = /contact/ { return 301 https://easternlm.com/contact; }
    location = /my-account { return 301 https://easternlm.com/account/orders; }
    location = /my-account/ { return 301 https://easternlm.com/account/orders; }

    # ── WP admin — DO NOT redirect (keep accessible for POS) ──
    # Remove this block after Phase 6 (custom POS) is live
    # location /wp-admin { proxy_pass http://wordpress_upstream; }
    # location /wp-login.php { proxy_pass http://wordpress_upstream; }

    # ── Catch-all: everything else → homepage ──────────────────
    location / {
        return 301 https://easternlm.com$request_uri;
    }
}
